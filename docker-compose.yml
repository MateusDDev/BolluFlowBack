services:
  backend:
    env_file: ".env"
    build:
      context: .
      dockerfile: Dockerfile
    image: bollu-back:latest
    container_name: backend_prod
    ports:
      - "8080:80"
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ConnectionStrings__Default=${DB_CONNECTION_STRING}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s